<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#EFE6D4" />
<title>测测你将来获取财富的方式</title>
<link rel="preconnect" href="https://miaoda.feishu.cn" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
<style>
  /* ============ 基础与配色 ============ */
  :root{
    --paper:#EFE6D4;
    --paper-2:#F7F0E1;
    --paper-3:#FCF7EC;
    --ink:#1E1B17;
    --ink-2:#4A443C;
    --ink-3:#7C7368;
    --cinnabar:#B23A2E;
    --cinnabar-d:#8E2C22;
    --cinnabar-l:#D2705F;
    --gold:#B9944F;
    --gold-l:#D9BE8A;
    --line:#DCCDB3;
    --shadow:0 18px 40px -24px rgba(58,42,24,.45);
    --serif:"Noto Serif SC","Songti SC","Source Han Serif SC",STSong,"SimSun",serif;
    --sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --radius:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;overflow-x:hidden;}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background-color:var(--paper);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,.55), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(184,148,79,.13), transparent 46%),
      repeating-linear-gradient(0deg, rgba(120,98,66,.035) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(120,98,66,.03) 0 1px, transparent 1px 4px);
    background-attachment:fixed;
    min-height:100vh;
    min-height:100dvh;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  p{margin:0;}
  h1,h2,h3{margin:0;font-weight:700;}
  button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit;}
  .wrap{width:100%;max-width:720px;margin:0 auto;padding:0 22px;}
  .view{display:none;}
  .view.is-active{display:block;animation:viewIn .5s cubic-bezier(.22,.9,.28,1) both;}
  @keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  /* ============ 首页 ============ */
  #view-intro{min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;padding:48px 0;}
  #view-intro.is-active{display:flex;}
  .intro-inner{width:100%;text-align:center;position:relative;padding-top:12px;}
  .seal{
    width:56px;height:56px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;
    border:2px solid var(--cinnabar);border-radius:4px;color:var(--cinnabar);
    font-family:var(--serif);font-size:27px;font-weight:700;letter-spacing:0;
    box-shadow:inset 0 0 0 3px rgba(178,58,46,.12);
    transform:rotate(-3deg);
    background:rgba(255,255,255,.35);
  }
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--ink-3);text-transform:uppercase;
    margin-bottom:18px;
  }
  .intro-title{
    font-family:var(--serif);font-weight:900;
    font-size:clamp(30px,8.6vw,44px);
    line-height:1.32;letter-spacing:.04em;
    color:var(--ink);
  }
  .intro-title em{font-style:normal;color:var(--cinnabar);position:relative;}
  .intro-title em::after{
    content:"";position:absolute;left:0;right:0;bottom:2px;height:8px;
    background:linear-gradient(90deg,rgba(178,58,46,.0),rgba(178,58,46,.22),rgba(178,58,46,.0));
    z-index:-1;
  }
  .gold-rule{
    width:76px;height:1px;margin:26px auto;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    position:relative;
  }
  .gold-rule::after{
    content:"";position:absolute;left:50%;top:-3px;width:6px;height:6px;
    margin-left:-3px;transform:rotate(45deg);
    background:var(--gold);opacity:.75;
  }
  .meta-row{
    display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px auto 34px;
  }
  .meta-chip{
    font-size:12px;color:var(--ink-3);
    border:1px solid var(--line);border-radius:999px;
    padding:6px 14px;background:rgba(255,255,255,.5);
    letter-spacing:.04em;
  }
  .btn-primary{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    min-height:52px;padding:0 40px;
    background:linear-gradient(180deg,var(--cinnabar) 0%,var(--cinnabar-d) 100%);
    color:#FBF3E2;font-size:16px;font-weight:500;letter-spacing:.16em;
    border-radius:6px;box-shadow:0 14px 26px -16px rgba(142,44,34,.9),inset 0 1px 0 rgba(255,255,255,.18);
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
    width:100%;max-width:300px;
  }
  .btn-primary:hover{filter:brightness(1.06);box-shadow:0 18px 30px -16px rgba(142,44,34,.95),inset 0 1px 0 rgba(255,255,255,.22);}
  .btn-primary:active{transform:translateY(1px) scale(.995);}
  .intro-foot{margin-top:30px;font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;}

  /* ============ 答题页 ============ */
  #view-quiz{padding:0 0 40px;}
  .quiz-head{
    position:sticky;top:0;z-index:8;
    background:linear-gradient(180deg,rgba(239,230,212,.97),rgba(239,230,212,.86));
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    padding:16px 0 12px;border-bottom:1px solid rgba(220,205,179,.7);
  }
  .quiz-head-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .quiz-count{font-size:12.5px;letter-spacing:.14em;color:var(--ink-2);}
  .quiz-count b{font-family:var(--serif);font-size:19px;color:var(--cinnabar);font-weight:700;letter-spacing:0;margin:0 1px;}
  .quiz-percent{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.06em;}
  .bar-track{
    margin-top:11px;height:3px;background:rgba(30,27,23,.10);border-radius:3px;overflow:hidden;
  }
  .bar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--cinnabar),#C86A54 55%,var(--gold));
    border-radius:3px;
    transition:width .42s cubic-bezier(.22,.9,.28,1);
  }
  .quiz-body{padding-top:30px;}

  .q-card{
    background:var(--paper-3);
    border:1px solid rgba(220,205,179,.9);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 20px 22px;
    position:relative;
  }
  .q-card::before,.q-card::after{
    content:"";position:absolute;width:16px;height:16px;border:1px solid var(--gold-l);opacity:.7;
  }
  .q-card::before{left:8px;top:8px;border-right:0;border-bottom:0;}
  .q-card::after{right:8px;bottom:8px;border-left:0;border-top:0;}
  .q-index{
    font-family:var(--serif);font-size:12px;color:var(--gold);
    letter-spacing:.2em;margin-bottom:12px;
  }
  .q-text{
    font-family:var(--serif);font-size:clamp(19px,4.6vw,23px);
    font-weight:600;line-height:1.55;letter-spacing:.01em;color:var(--ink);
    text-wrap:pretty;
  }
  .q-hint{font-size:12px;color:var(--ink-3);margin-top:10px;letter-spacing:.04em;}
  .options{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;align-items:flex-start;gap:12px;width:100%;
    min-height:56px;padding:14px 16px;
    text-align:left;
    background:var(--paper-2);
    border:1px solid rgba(220,205,179,.95);
    border-radius:7px;
    color:var(--ink-2);
    font-size:15px;line-height:1.6;
    position:relative;overflow:hidden;
    transition:border-color .2s ease, background .2s ease, transform .16s ease, box-shadow .2s ease;
  }
  .opt:hover{border-color:var(--gold);background:#FBF4E6;transform:translateY(-1px);}
  .opt:active{transform:translateY(0);}
  .opt .key{
    flex:0 0 auto;width:24px;height:24px;border-radius:50%;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:12.5px;color:var(--ink-3);
    margin-top:1px;transition:all .2s ease;
  }
  .opt .txt{padding-top:1px;}
  .opt.is-selected{
    border-color:var(--cinnabar);
    background:#FBEFE8;
    box-shadow:0 0 0 3px rgba(178,58,46,.10);
    color:var(--ink);
  }
  .opt.is-selected .key{border-color:var(--cinnabar);background:var(--cinnabar);color:#FBF3E2;}
  .opt.is-selected::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cinnabar);
  }
  .quiz-nav{display:flex;align-items:center;justify-content:space-between;margin-top:22px;gap:12px;}
  .btn-ghost{
    min-height:44px;padding:0 16px;border-radius:6px;
    font-size:13.5px;color:var(--ink-3);letter-spacing:.06em;
    border:1px solid transparent;
    display:inline-flex;align-items:center;gap:6px;
    transition:color .2s ease,border-color .2s ease,background .2s ease;
  }
  .btn-ghost:hover{color:var(--cinnabar);border-color:rgba(178,58,46,.28);background:rgba(255,255,255,.4);}
  .btn-ghost:disabled{opacity:.32;cursor:default;}
  .btn-ghost:disabled:hover{color:var(--ink-3);border-color:transparent;background:none;}
  .quiz-tip{font-size:12px;color:var(--ink-3);letter-spacing:.04em;}

  /* ============ 结果页 ============ */
  #view-result{padding:30px 0 46px;}
  .result-shell{max-width:520px;margin:0 auto;}
  .poster{
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,.72), transparent 55%),
      linear-gradient(180deg,#FDF8EC 0%,#F5ECDA 72%,#F1E6D1 100%);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 26px 60px -34px rgba(58,42,24,.6), 0 2px 0 rgba(255,255,255,.7) inset;
    padding:30px 22px 26px;
    position:relative;
    overflow:hidden;
  }
  .poster::before{
    content:"";position:absolute;inset:9px;border:1px solid rgba(185,148,79,.42);border-radius:7px;
    pointer-events:none;
  }
  .poster::after{
    content:"";position:absolute;inset:14px;border:1px solid rgba(185,148,79,.16);border-radius:5px;
    pointer-events:none;
  }
  .poster-inner{position:relative;z-index:1;}
  .res-top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;}
  .res-label{font-size:11px;letter-spacing:.3em;color:var(--gold);}
  .hair{flex:0 0 26px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-l));}
  .hair.r{background:linear-gradient(90deg,var(--gold-l),transparent);}
  .res-type{
    font-family:var(--serif);font-weight:900;
    font-size:clamp(34px,10vw,46px);
    line-height:1.2;letter-spacing:.06em;text-align:center;color:var(--ink);
    margin:0 0 6px;
  }
  .res-type span{color:var(--cinnabar);}
  .res-title{
    text-align:center;font-family:var(--serif);font-size:15px;color:var(--ink-2);
    letter-spacing:.08em;margin-top:4px;
  }
  .res-sub{
    margin:16px auto 0;display:flex;flex-direction:column;gap:5px;
    font-size:12.5px;color:var(--ink-3);text-align:center;
  }
  .res-sub .tagtxt{color:var(--ink-2);}
  .res-sub strong{color:var(--cinnabar-d);font-weight:500;}
  .res-sub .strength{
    display:inline-block;margin-left:6px;font-size:10.5px;letter-spacing:.02em;
    border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink-3);
    vertical-align:middle;
  }
  .quote-block{
    margin:19px 0 0;padding:16px 14px;
    border-top:1px solid rgba(185,148,79,.35);
    border-bottom:1px solid rgba(185,148,79,.35);
    text-align:center;
    font-family:var(--serif);font-size:clamp(16px,4.3vw,19px);
    line-height:1.9;letter-spacing:.06em;color:var(--ink);
    background:rgba(255,255,255,.35);
  }
  .quote-block::before{content:"「";color:var(--gold);font-size:20px;}
  .quote-block::after{content:"」";color:var(--gold);font-size:20px;}
  .sec{margin-top:19px;}
  .sec-h{
    display:flex;align-items:center;gap:9px;
    font-family:var(--serif);font-size:13px;font-weight:600;
    letter-spacing:.16em;color:var(--cinnabar-d);margin-bottom:9px;
  }
  .sec-h i{
    font-style:normal;width:14px;height:14px;flex:0 0 auto;
    border:1px solid rgba(178,58,46,.5);transform:rotate(45deg);
    display:block;
  }
  .sec-h i::after{content:"";display:block;width:5px;height:5px;margin:3.5px;background:rgba(178,58,46,.28);}
  .sec p{font-size:14px;line-height:1.9;color:var(--ink-2);text-align:justify;}
  .traits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .traits li{
    font-size:13.5px;color:var(--ink-2);line-height:1.75;padding-left:15px;position:relative;
  }
  .traits li::before{
    content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;border-radius:50%;
    background:var(--gold);opacity:.85;
  }
  .why{font-size:14px;line-height:1.9;color:var(--ink-2);}
  .why + .why{margin-top:9px;}
  .why em{font-style:normal;color:var(--cinnabar-d);font-weight:600;}
  .ev{list-style:none;margin:0 0 11px;padding:0;display:flex;flex-direction:column;gap:6px;}
  .ev li{
    padding:7px 11px;border-left:2px solid rgba(178,58,46,.3);
    background:rgba(255,255,255,.42);border-radius:0 4px 4px 0;
  }
  .ev .evq{display:block;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em;line-height:1.5;}
  .ev .eva{display:block;font-size:13.5px;color:var(--ink);line-height:1.6;}
  .scroll-hint{
    margin-top:20px;text-align:center;font-size:11px;color:var(--ink-3);letter-spacing:.14em;
    animation:hintPulse 2.4s ease-in-out infinite;
  }
  @keyframes hintPulse{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(3px)}}
  .two-col{display:grid;grid-template-columns:1fr;gap:14px;}
  .mini-box{
    background:rgba(255,255,255,.5);border:1px solid rgba(220,205,179,.85);
    border-radius:8px;padding:14px 15px;
  }
  .mini-box .t{font-size:12px;letter-spacing:.18em;color:var(--gold);margin-bottom:7px;}
  .mini-box p{font-size:13.5px;line-height:1.85;color:var(--ink-2);}
  .egg{
    margin-top:24px;padding:16px 15px;border-radius:8px;
    background:linear-gradient(180deg,rgba(178,58,46,.055),rgba(178,58,46,.02));
    border:1px dashed rgba(178,58,46,.35);
  }
  .egg .t{font-size:11.5px;letter-spacing:.24em;color:var(--cinnabar);margin-bottom:6px;}
  .egg p{font-size:13.5px;line-height:1.85;color:var(--ink-2);}
  .save-tip{
    margin-top:20px;text-align:center;font-size:11.5px;color:var(--ink-3);letter-spacing:.1em;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .save-tip::before,.save-tip::after{content:"";width:18px;height:1px;background:var(--line);}
  .poster-foot{
    margin-top:22px;padding-top:14px;border-top:1px solid rgba(185,148,79,.28);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .brand{font-family:var(--serif);font-size:11px;color:var(--ink-3);letter-spacing:.18em;}
  .seal-sm{
    width:34px;height:34px;border:1.5px solid rgba(178,58,46,.55);border-radius:3px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:15px;color:rgba(178,58,46,.8);transform:rotate(-4deg);
  }
  .result-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
  .btn-secondary{
    min-height:50px;border-radius:6px;border:1px solid rgba(178,58,46,.42);
    color:var(--cinnabar-d);background:rgba(255,255,255,.55);
    font-size:14.5px;letter-spacing:.1em;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s ease,color .2s ease,transform .16s ease;
  }
  .btn-secondary:hover{background:rgba(178,58,46,.08);}
  .btn-secondary:active{transform:translateY(1px);}
  .disclaimer{
    margin-top:22px;font-size:10.5px;line-height:1.75;color:var(--ink-3);
    text-align:center;letter-spacing:.02em;opacity:.9;
  }
  .disclaimer-wrap{padding:0 6px;}

  /* 结果页动效 */
  .reveal{opacity:0;transform:translateY(12px);animation:reveal .62s cubic-bezier(.22,.9,.28,1) forwards;}
  @keyframes reveal{to{opacity:1;transform:none}}

  /* ============ 手机竖屏结果卡优化 ============ */
  @media (max-width:420px){
    .wrap{padding:0 16px;}
    .poster{padding:26px 16px 22px;}
    .res-type{font-size:clamp(34px,11vw,44px);}
    .sec p,.why,.traits li,.mini-box p,.egg p{font-size:13.5px;}
    .q-card{padding:22px 15px 18px;}
    .opt{font-size:14.5px;padding:13px 13px;}
  }
  @media (min-width:560px){
    .two-col{grid-template-columns:1fr 1fr;}
    .result-actions{flex-direction:row;}
    .result-actions .btn-secondary{flex:1;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<!-- ================= 视图：首页 ================= -->
<section class="view is-active" id="view-intro">
  <div class="wrap intro-inner">
    <div class="seal" aria-hidden="true">财</div>
    <div class="eyebrow">A Fun Quiz · 40 Questions</div>
    <h1 class="intro-title">测测你将来<br /><em>获取财富的方式</em></h1>
    <div class="gold-rule" aria-hidden="true"></div>
    <div class="meta-row">
      <span class="meta-chip">40 道选择题</span>
      <span class="meta-chip">约 6 分钟</span>
      <span class="meta-chip">8 种财富路径</span>
    </div>
    <button class="btn-primary" id="btn-start" type="button">开 始 测 试</button>
    <p class="intro-foot">仅供娱乐 · 不构成任何财务建议</p>
  </div>
</section>

<!-- ================= 视图：答题 ================= -->
<section class="view" id="view-quiz">
  <div class="quiz-head">
    <div class="wrap">
      <div class="quiz-head-row">
        <div class="quiz-count">第 <b id="q-no">1</b> 题 / 共 40 题</div>
        <div class="quiz-percent" id="q-pct">0%</div>
      </div>
      <div class="bar-track" role="progressbar" aria-label="答题进度" aria-valuemin="0" aria-valuemax="40" aria-valuenow="0" id="bar-track">
        <div class="bar-fill" id="bar-fill"></div>
      </div>
    </div>
  </div>
  <div class="wrap quiz-body">
    <div class="q-card" id="q-card">
      <div class="q-index" id="q-index">QUESTION 01</div>
      <h2 class="q-text" id="q-text">题目</h2>
      <p class="q-hint">选最像你的那个，别想太久。</p>
      <ul class="options" id="q-options"></ul>
    </div>
    <div class="quiz-nav">
      <button class="btn-ghost" id="btn-back" type="button" disabled>← 上一题</button>
      <span class="quiz-tip">没有标准答案，第一反应最准</span>
    </div>
  </div>
</section>

<!-- ================= 视图：结果 ================= -->
<section class="view" id="view-result">
  <div class="wrap result-shell">
    <div class="poster">
      <div class="poster-inner" id="poster-inner">
        <!-- 动态渲染 -->
      </div>
    </div>
    <div class="result-actions">
      <button class="btn-secondary" id="btn-restart" type="button">重新测一次</button>
      <button class="btn-secondary" id="btn-home" type="button">回到首页</button>
    </div>
    <div class="disclaimer-wrap">
      <p class="disclaimer">本测试为趣味人格向内容，结果由答题选项加权生成，不具备心理测评或财务诊断效力，<br />不构成任何投资、理财、职业建议。请勿据此做现实决策。</p>
    </div>
  </div>
</section>

<script>
/* ==========================================================================
   1. 维度定义与结果文案
   ========================================================================== */
var DIM_ORDER = ['zhi','shou','jing','lian','wen','chuang','ji','fu'];

var DIMS = {
  zhi: {
    key:'zhi', name:'智囊型', tag:'靠认知与专业判断变现',

/* ==========================================================================
   3. 评分引擎
   ========================================================================== */
var TOTAL = QUESTIONS.length;
var MAX_PER_DIM = (function(){
  var max = {};
  DIM_ORDER.forEach(function(k){ max[k] = 0; });
  QUESTIONS.forEach(function(item){
    var best = {};
    item.opts.forEach(function(opt){
      var ws = opt.w || {};
      Object.keys(ws).forEach(function(k){
        if (ws[k] > 0) best[k] = Math.max(best[k] || 0, ws[k]);
      });
    });
    Object.keys(best).forEach(function(k){ max[k] += best[k]; });
  });
  return max;
})();

function computeScores(answers){
  var raw = {};
  DIM_ORDER.forEach(function(k){ raw[k] = 0; });
  for (var i = 0; i < TOTAL; i++){
    var ans = answers[i];
    if (ans === null || ans === undefined) continue;
    var q = QUESTIONS[i];
    if (!q || !q.opts[ans]) continue;
    var ws = q.opts[ans].w || {};
    Object.keys(ws).forEach(function(k){
      if (typeof raw[k] === 'number' && typeof ws[k] === 'number' && isFinite(ws[k])){
        raw[k] += ws[k];
      }
    });
  }
  var scores = DIM_ORDER.map(function(k, idx){
    var m = MAX_PER_DIM[k] > 0 ? MAX_PER_DIM[k] : 1;
    var norm = raw[k] / m;
    if (!isFinite(norm)) norm = 0;
    return { key:k, raw:raw[k], norm:norm, order:idx };
  });
  // 排序：归一化得分降序；同分按固定优先级（DIM_ORDER 顺序）决断，保证结果稳定可复现
  scores.sort(function(a, b){
    if (b.norm !== a.norm) return b.norm - a.norm;
    return a.order - b.order;
  });
  return scores;
}

function getTopEvidence(answers, dimKey, limit){
  var list = [];
  for (var i = 0; i < TOTAL; i++){
    var ans = answers[i];
    if (ans === null || ans === undefined) continue;
    var q = QUESTIONS[i];
    var opt = q && q.opts[ans];
    if (!opt) continue;
    var w = (opt.w && opt.w[dimKey]) || 0;
    if (w > 0){
      list.push({ idx:i, q:q.q, opt:opt.t, w:w });
    }
  }
  list.sort(function(a, b){ return b.w - a.w || a.idx - b.idx; });
  return list.slice(0, limit || 3);
}

function shortLabel(text){
  var clean = String(text || '')
    .replace(/……|…/g, '')
    .replace(/「|」|“|”/g, '')
    .replace(/[？?。.！!]+$/g, '')
    .trim();
  return clean.length > 12 ? clean.slice(0, 12) + '…' : clean;
}

/* ==========================================================================
   4. 视图与交互
   ========================================================================== */
var state = {
  index: 0,
  answers: new Array(TOTAL).fill(null),
  locked: false
};

var el = {
  intro: document.getElementById('view-intro'),
  quiz: document.getElementById('view-quiz'),
  result: document.getElementById('view-result'),
  qNo: document.getElementById('q-no'),
  qPct: document.getElementById('q-pct'),
  qIndex: document.getElementById('q-index'),
  qText: document.getElementById('q-text'),
  qOptions: document.getElementById('q-options'),
  barFill: document.getElementById('bar-fill'),
  barTrack: document.getElementById('bar-track'),
  btnBack: document.getElementById('btn-back'),
  poster: document.getElementById('poster-inner'),
  qCard: document.getElementById('q-card')
};

function showView(name){
  [el.intro, el.quiz, el.result].forEach(function(v){ v.classList.remove('is-active'); });
  if (name === 'intro') el.intro.classList.add('is-active');
  if (name === 'quiz') el.quiz.classList.add('is-active');
  if (name === 'result') el.result.classList.add('is-active');
  window.scrollTo({ top:0, behavior:'auto' });
}

function pad2(n){ return (n < 10 ? '0' : '') + n; }

function renderQuestion(animate){
  var q = QUESTIONS[state.index];
  el.qNo.textContent = String(state.index + 1);
  var answered = state.answers.filter(function(a){ return a !== null; }).length;
  var pct = Math.round(answered / TOTAL * 100);
  el.qPct.textContent = pct + '%';
  el.barFill.style.width = pct + '%';
  el.barTrack.setAttribute('aria-valuenow', String(answered));
  el.qIndex.textContent = 'QUESTION ' + pad2(state.index + 1);
  el.qText.textContent = q.q;

  el.qOptions.innerHTML = '';
  var keys = ['A','B','C','D'];
  q.opts.forEach(function(opt, i){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opt' + (state.answers[state.index] === i ? ' is-selected' : '');
    btn.setAttribute('aria-pressed', state.answers[state.index] === i ? 'true' : 'false');
    var k = document.createElement('span');
    k.className = 'key';
    k.textContent = keys[i];
    var t = document.createElement('span');
    t.className = 'txt';
    t.textContent = opt.t;
    btn.appendChild(k);
    btn.appendChild(t);
    btn.addEventListener('click', function(){ choose(i); });
    el.qOptions.appendChild(btn);
  });

  el.btnBack.disabled = state.index === 0;

  if (animate){
    el.qCard.style.animation = 'none';
    // 强制回流后再播放动画，避免连续切题时动画被合并
    void el.qCard.offsetWidth;
    el.qCard.style.animation = 'revealItem .38s cubic-bezier(.22,.9,.28,1) both';
    el.qOptions.style.animation = 'none';
    void el.qOptions.offsetWidth;
    el.qOptions.style.animation = 'revealItem .46s cubic-bezier(.22,.9,.28,1) both';
  }
}

function choose(i){
  if (state.locked) return;
  state.locked = true;
  state.answers[state.index] = i;

  Array.prototype.forEach.call(el.qOptions.children, function(node, idx){
    node.classList.toggle('is-selected', idx === i);
    node.setAttribute('aria-pressed', idx === i ? 'true' : 'false');
  });

  var answered = state.answers.filter(function(a){ return a !== null; }).length;
  el.qPct.textContent = Math.round(answered / TOTAL * 100) + '%';
  el.barFill.style.width = Math.round(answered / TOTAL * 100) + '%';
  el.barTrack.setAttribute('aria-valuenow', String(answered));

  window.setTimeout(function(){
    state.locked = false;
    if (state.index < TOTAL - 1){
      state.index += 1;
      renderQuestion(true);
    } else {
      showResult();
    }
  }, 280);
}

function goBack(){
  if (state.index === 0 || state.locked) return;
  state.index -= 1;
  renderQuestion(true);
}

function resetAll(){
  state.index = 0;
  state.answers = new Array(TOTAL).fill(null);
  state.locked = false;
  el.barFill.style.width = '0%';
  el.qPct.textContent = '0%';
  renderQuestion(false);
}

/* ==========================================================================
   5. 结果渲染
   ========================================================================== */
function buildPoster(){
  var scores = computeScores(state.answers);
  var top = scores[0];
  var second = scores[1];
  var main = DIMS[top.key];
  var sub = DIMS[second.key];

  var gapRate = top.norm > 0 ? second.norm / top.norm : 0;
  var subStrength = gapRate >= 0.93 ? '主副几乎并列' : (gapRate >= 0.72 ? '副路径明显' : '主路径很清晰');

  var evidence = getTopEvidence(state.answers, top.key, 3);
  var evidenceHTML = '';
  if (evidence.length){
    var rows = evidence.map(function(e){
      return '<li><span class="evq">问：' + escapeHTML(shortLabel(e.q)) + '</span>' +
             '<span class="eva">你选：「' + escapeHTML(e.opt) + '」</span></li>';
    }).join('');
    evidenceHTML =
      '<ul class="ev">' + rows + '</ul>' +
      '<p class="why">这几道题的答案放在一起，指向的是同一件事：<em>' + escapeHTML(main.tag) + '</em>。</p>' +
      '<p class="why">' + escapeHTML(main.why) + '</p>';
  } else {
    evidenceHTML = '<p class="why">' + escapeHTML(main.why) + '</p>';
  }

  var traitsHTML = main.traits.map(function(t){ return '<li>' + escapeHTML(t) + '</li>'; }).join('');
  var quote = '「' + main.quote + '」';

  el.poster.innerHTML =
    '<div class="reveal">' +
      '<div class="res-top">' +
        '<span class="hair"></span><span class="res-label">YOUR WEALTH PATH</span><span class="hair r"></span>' +
      '</div>' +
      '<h2 class="res-type">' + escapeHTML(main.name).replace('型','') + '<span>型</span></h2>' +
      '<p class="res-title">' + escapeHTML(main.subtitle) + '</p>' +
      '<div class="res-sub">' +
        '<div>主路径 · <span class="tagtxt">' + escapeHTML(main.tag) + '</span></div>' +
        '<div>副路径 · <strong>' + escapeHTML(sub.name) + '</strong><span class="strength">' + escapeHTML(subStrength) + '</span></div>' +
      '</div>' +
      '<div class="quote-block">' + escapeHTML(main.quote) + '</div>' +
    '</div>' +

    '<div class="reveal" style="animation-delay:.10s">' +
      '<div class="sec">' +
        '<div class="sec-h"><i></i>性格特点</div>' +
        '<ul class="traits">' + traitsHTML + '</ul>' +
      '</div>' +
      '<div class="sec">' +
        '<div class="sec-h"><i></i>为什么是你</div>' + evidenceHTML +
      '</div>' +
      '<div class="scroll-hint">↓ 往下滑：你的盲点与彩蛋 ↓</div>' +
      '<div class="two-col">' +
        '<div class="mini-box"><div class="t">隐藏优势</div><p>' + escapeHTML(main.advantage) + '</p></div>' +
        '<div class="mini-box"><div class="t">隐藏风险 / 盲点</div><p>' + escapeHTML(main.blind) + '</p></div>' +
      '</div>' +
      '<div class="egg"><div class="t">彩蛋</div><p>' + escapeHTML(main.egg) + '</p></div>' +
      '<div class="save-tip">长按保存 / 截图保存，直接发出去</div>' +
      '<div class="poster-foot">' +
        '<span class="brand">测测你将来获取财富的方式</span>' +
        '<span class="seal-sm">财</span>' +
      '</div>' +
    '</div>';
}

function showResult(){
  var allAnswered = state.answers.every(function(a){ return a !== null; });
  if (!allAnswered){
    // 兜底：未答完则不进入结果页，回到第一个未答题目
    var firstEmpty = state.answers.findIndex(function(a){ return a === null; });
    state.index = firstEmpty >= 0 ? firstEmpty : 0;
    renderQuestion(true);
    return;
  }
  buildPoster();
  showView('result');
}

function escapeHTML(str){
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ==========================================================================
   6. 事件绑定与启动
   ========================================================================== */
document.getElementById('btn-start').addEventListener('click', function(){
  resetAll();
  showView('quiz');
});
el.btnBack.addEventListener('click', goBack);
document.getElementById('btn-restart').addEventListener('click', function(){
  resetAll();
  showView('quiz');
});
document.getElementById('btn-home').addEventListener('click', function(){
  resetAll();
  showView('intro');
});

// 键盘快捷键：1-4 选项 / 左右方向键翻页（桌面端体验）
document.addEventListener('keydown', function(e){
  if (!el.quiz.classList.contains('is-active')) return;
  var map = { '1':0, '2':1, '3':2, '4':3 };
  if (map.hasOwnProperty(e.key)){ choose(map[e.key]); }
  if (e.key === 'ArrowLeft'){ goBack(); }
});

// 全局动画关键帧（供 JS 动态挂载）
(function(){
  var style = document.createElement('style');
  style.textContent =
    '@keyframes revealItem{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}';
  document.head.appendChild(style);
})();

renderQuestion(false);
